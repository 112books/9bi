      - { label: "Data de final", name: "data_fi", widget: "datetime", time_format: false, date_format: "YYYY-MM-DD", format: "YYYY-MM-DD", required: false }
      - { label: "Etiqueta del blog", name: "etiqueta", widget: "string", required: false, hint: "Els articles amb aquesta etiqueta surten com a reportatges a la pàgina del projecte (p. ex. 13-B)." }
