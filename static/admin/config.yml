          - { label: "Punt de trobada", name: "punt_trobada", widget: "string", required: false }
          - { label: "Coordinació (9bi)", name: "coordinador", widget: "string", required: false }
          - { label: "Estat", name: "estat", widget: "select", options: ["prevista", "feta", "anul·lada"], required: false }
          - { label: "Articles del blog", name: "articles", widget: "list", required: false, hint: "Una adreça per element, p. ex. /2017/04/13-b-04-roquetas.html" }
      - { label: "Text (opcional)", name: "body", widget: "markdown", required: false }

