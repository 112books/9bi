# Decap CMS — configuració del blog 9 Barris Imatge
# Docs backend Gitea/Forgejo: https://decapcms.org/docs/gitea-backend/
#
# Nota (2026-09-18): backend "gitea" (NO "forgejo"). La raó: el backend "forgejo"
# de Decap llista les carpetes amb l'arbre recursiu del repo sencer
# (git/trees/{sha}?recursive=1) i Codeberg el trunca a 1000 nodes → les carpetes
# tardanes alfabèticament (content/posts/2014+ i data/membres) sortien buides.
# El backend "gitea" fa servir l'endpoint per path (git/trees/{branch}:{path}),
# que no es trunca, i és el que el doc de Decap recomana per a repos Forgejo.
#
# ABANS DE DESPLEGAR, cal:
# 1. Crear el repositori al Codeberg (p. ex. linuxbcn/9barrisimatge)
# 2. A Codeberg: Settings → Applications → "Create new OAuth2 Application"
#    - Application name: 9barrisimatge CMS
#    - Redirect URI: https://9barrisimatge.org/admin/
#    - Uncheck "Confidential client"
# 3. Copiar el "Client ID" al camp app_id d'aquí sota

backend:
  name: gitea
  repo: linuxbcn/9bi
  app_id: 0c6b6c51-bea8-4b64-8c1e-96bbf02eef15
  api_root: https://codeberg.org/api/v1
  base_url: https://codeberg.org
  auth_endpoint: https://codeberg.org/login/oauth/authorize
  branch: main

locale: "ca"

# Les imatges que pugen els editors van a static/images i es serveixen a /images
media_folder: "static/images"
public_folder: "/images"

# Llista d'autors reutilitzada per totes les col·leccions d'articles
x-autors: &autors
  - "Alberto Sanagustín"
  - "Francesc Barbe"
  - "Iozsef Kiss"
  - "Ismael Utrilla"
  - "Joan \"Linux\" Martínez i Serres"
  - "Juan Carlos Molina (Grismedio Casinegro)"
  - "Manel Sala \"Ulls\" Circ"
  - "Pedro \"Casal\" Cervera"
  - "Pedro Click"
  - "Núria Laura Orbaneja"
  - "Manel Villalba"
  - "Nico YeYe"
  - "9 Barris Imatge"
collections:
  - name: "posts-2026"
    label: "Articles · 2026"
    folder: "content/posts/2026"
    create: true
    sortable_fields:
      - { field: "date", label: "Data", default_sort: desc }
      - { field: "title", label: "Títol" }
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Títol", name: "title", widget: "string" }
      - { label: "Data de publicació", name: "date", widget: "datetime" }
      - { label: "Any (el posa el sistema)", name: "year", widget: "hidden", default: "2026" }
      - { label: "Slug de l'URL (no tocar normalment)", name: "slug", widget: "string", required: false, hint: "Part final de l'URL. Preserva les URL originals del blog; no el canviïs si no cal." }
      - { label: "Autor", name: "author", widget: "select", options: *autors }
      - label: "Fotografia principal"
        name: "cover"
        widget: "object"
        required: false
        hint: "La foto que encapçala l'article (es mostra a la portada i a l'article)."
        fields:
          - { label: "Imatge", name: "image", widget: "image" }
      - { label: "Enllaç a l'àlbum de fotos", name: "album_url", widget: "string", required: false, hint: "Link a Google Photos o similar amb tot el reportatge." }
      - { label: "Paraules clau (tags)", name: "tags", widget: "list", required: false }
      - { label: "Descripció (opcional)", name: "description", widget: "text", required: false, hint: "Apareix a la llista d'articles i al RSS." }
      - { label: "Cos de l'article", name: "body", widget: "markdown", hint: "Podeu fer servir links, llistes i negretes amb Markdown." }

