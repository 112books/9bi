        name: "sessions"
        widget: "list"
        required: false
        summary: "{{fields.data}} · {{fields.nom}} · {{fields.barri}}"
        fields:
          - { label: "Nom de la sessió", name: "nom", widget: "string", required: false, hint: "P. ex. Ruta 3" }
          - { label: "Barri", name: "barri", widget: "string", required: false }
          - { label: "Data", name: "data", widget: "datetime", time_format: false, date_format: "YYYY-MM-DD", format: "YYYY-MM-DD", required: false }
