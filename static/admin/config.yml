# Sveltia CMS — configuració del blog 9 Barris Imatge
# Docs config: https://sveltiacms.app/en/docs/configuration/
#
# Nota (2026-09-24): backend "github" (GitHub). Producció ja és a github.com/112books/9bi.
# Sveltia llegeix direccions amb l'arbre recursiu amb paginació i per problemes d'una carpeta
# gran (3.010 posts + data/membres) això funciona a GitHub. Els camps "sortable_fields" i
# "thumbnail" estan adaptats al format d'Sveltia (compatible amb Static CMS).
#
# Entrada: des de la pantalla d'accés de l'admin pots usar:
#   1. "Log in with a personal access token" i enganxar un token (classic) amb scope `repo`
#      es genera a GitHub → Settings → Developer settings → Personal access tokens.
#   2. Si es crea una GitHub OAuth App (Settings → Developer settings → OAuth Apps) amb
#      redirect a https://9barrisimatge.org/admin/, es pot descomentar app_id + auth_endpoint
#      (vegeu comentari a sota).
backend:
  name: github
  repo: 112books/9bi
  branch: main
  # Si es configura una GitHub OAuth App (record perdre per obtenir aquests valors):
  # app_id: <Client ID de l'OAuth App de GitHub>
  # base_url: https://github.com
  # auth_endpoint: https://github.com/login/oauth/authorize

# Nota idioma: Sveltia detecta la llengua del navegador de cada editor (el camp
# "locale" de Decap ja no s'aplica; per tant no s'ha d'afegir).

# Les imatges que pugen els editors van a static/images i es serveixen a /images
media_folder: "static/images"
public_folder: "/images"

# Llista d'autors reutilitzada per totes les col·leccions d'articles
x-autors: &autors
  - "Alberto Sanagustín"
  - "A.Sedano"
  - "Dani González"
  - "Francesc Barbe"
  - "Guillem"
  - "Héctor J. Oca"
  - "Ignasi"
  - "inma"
  - "Iozsef Kiss"
  - "Ismael Utrilla"
  - "Ivan"
  - "Joan \"Linux\" Martínez i Serres"
  - "Juan Carlos Molina (Grismedio Casinegro)"
  - "Manel Sala \"Ulls\" Circ"
  - "Manel Villalba"
  - "Nico YeYe"
  - "Núria Laura Orbaneja"
  - "pecalatrava"
  - "Pedro \"Casal\" Cervera"
  - "Pedro Click"
  - "petxina"
  - "Pili E. G."
  - "sandra"
  - "9 Barris Imatge"
collections:
  - name: "posts-2026"
    label: "Articles · 2026"
    folder: "content/posts/2026"
    create: true
    sortable_fields:
      fields:
        - date
        - title
      default:
        field: date
        direction: descending
    thumbnail: "cover.image"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Títol", name: "title", widget: "string" }
      - { label: "Data de publicació", name: "date", widget: "datetime" }
      - { label: "Any (el posa el sistema)", name: "year", widget: "hidden", default: "2026" }
      - { label: "Adreça web de l'article (no tocar)", name: "slug", widget: "string", required: false, hint: "És la part final de l'adreça (el que va abans de «.html»). Normalment s'omple sola i no cal tocar-la. Si la canvies, l'enllaç antic deixarà de funcionar i no es redirigeix. Canvia-la només si n'estàs segur." }
      - { label: "Autor", name: "author", widget: "select", options: *autors, default: "Joan \"Linux\" Martínez i Serres" }
      - label: "Fotografia principal"
        name: "cover"
        widget: "object"
        required: false
        hint: "La foto que encapçala l'article (es mostra a la portada i a l'article)."
        fields:
          - { label: "Imatge", name: "image", widget: "image" }
      - { label: "Enllaç a l'àlbum de fotos", name: "album_url", widget: "string", required: false, hint: "Link a Google Photos o similar amb tot el reportatge." }
      - { label: "Vídeos (YouTube o Vimeo)", name: "videos", widget: "list", required: false, hint: "Enganxeu un enllaç per línia (p. ex. https://vimeo.com/1232409395 o https://youtu.be/dQw4w9WgXcQ). Es mostraran al final de l'article, en ordre." }
      - { label: "Paraules clau (tags)", name: "tags", widget: "list", required: false, hint: "Escriu una etiqueta i prem Intro (o el botó «+») per afegir-la." }
      - { label: "Títol SEO (opcional)", name: "seoTitle", widget: "string", required: false, hint: "Títol per als cercadors i les xarxes (fins a ~60 caràcters). Si el deixes buit, s'usa el títol de l'article sense la data inicial." }
      - { label: "Descripció (SEO, opcional)", name: "description", widget: "text", required: false, hint: "Apareix a la llista, al RSS i com a meta descripció (SEO). Si el deixes buit, s'agafa un resum de l'article." }
      - { label: "Cos de l'article", name: "body", widget: "markdown", hint: "Podeu fer servir links, llistes i negretes amb Markdown." }

