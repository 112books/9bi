# Sveltia CMS — gestor INTERN de 9 Barris Imatge
#
# Edita el repositori PRIVAT 112books/9bi-intern (actes i documentació interna).
# Aquest fitxer és públic (és al web), però no conté cap secret: només diu on
# són les dades. Per llegir-les o escriure-les cal un token de GitHub d'algú
# amb accés al repositori privat. El token classic amb scope `repo` del gestor
# principal ja serveix; un token fine-grained ha d'incloure també 9bi-intern.
#
# La sessió es comparteix amb /admin/ (mateix navegador, mateix domini).
backend:
  name: github
  repo: 112books/9bi-intern
  branch: main

# Adjunts de les actes (queden dins del repositori privat, no es publiquen)
media_folder: "adjunts"
public_folder: "/adjunts"

# Membres actius (malnom o, si no en tenen, nom). Font: data/membres/ del repo
# públic, amb actiu: true, a 2026-09-30. Cal actualitzar-la a mà quan hi hagi
# una alta o una baixa: el CMS no pot llegir llistes d'un altre repositori.
x-membres: &membres
  - "Alberto Sanagustín"
  - "Francesc Barbe"
  - "Grismedio Casinegro"
  - "Iozsef Kiss"
  - "Ismael Utrilla"
  - "Joan Linux"
  - "Manel Sala \"Ulls\""
  - "Manel Villalba"
  - "Nico YeYe"
  - "Núria Orbaneja"
  - "Pedro Cervera"
  - "Pedro Click"

collections:
  - name: "actes"
    label: "Reunions (assamblees)"
    label_singular: "Acta de la reunió"
    folder: "actes"
    create: true
    slug: "acta-{{year}}-{{month}}-{{day}}-{{slug}}"
    sortable_fields: { fields: [date, title], default: { field: date, direction: descending } }
    summary: "{{date | date('YYYY-MM-DD')}} · {{title}}"
    fields:
      - { label: "Títol", name: "title", widget: "string" }
      - { label: "Data de la reunió", name: "date", widget: "datetime" }
      - { label: "Lloc", name: "lloc", widget: "string", required: false }
      - label: "Assistents"
        name: "assistents"
        widget: "select"
        multiple: true
        required: false
        options: *membres
      - label: "Altres assistents (text lliure)"
        name: "persones_reunides"
        widget: "list"
        required: false
        hint: "Qui no és a la llista de membres de dalt."
      - { label: "Convidats", name: "convidat", widget: "string", required: false }
      - label: "Ordre del dia"
        name: "ordre_del_dia"
        widget: "list"
        required: false
        hint: "Un punt per línia, en l'ordre en què es tracta."
      - label: "Acords"
        name: "acords"
        widget: "list"
        required: false
        hint: "Un acord per element, redactat perquè es pugui llegir d'aquí anys. Si es vota, deixa-ho a Votacions."
        summary: "{{fields.text}}"
        fields:
          - { label: "Acord", name: "text", widget: "text" }
          - { label: "Projecte (opcional)", name: "projecte", widget: "string", required: false, hint: "Identificador curt del projecte, p. ex. 13-b." }
      - label: "Votacions"
        name: "votacions"
        widget: "list"
        required: false
        hint: "Una votació per línia amb el resultat, per exemple: Proposta, 12 a favor, 3 en contra, 0 abstencions, aprovada."
      - label: "Tasques"
        name: "tasques"
        widget: "list"
        required: false
        hint: "Les tasques obertes de l'acta anterior es poden portar aquí amb el botó «Acta nova amb les tasques obertes» de la pàgina Tasques obertes."
        summary: "{{fields.estat}} · {{fields.responsable}} · {{fields.text}}"
        fields:
          - { label: "Identificador", name: "id", widget: "uuid", read_only: true, hint: "Automàtic. Permet seguir la mateixa tasca d'una acta a la següent." }
          - { label: "Tasca", name: "text", widget: "text" }
          - { label: "Responsable", name: "responsable", widget: "select", options: *membres, required: false }
          - { label: "Termini", name: "termini", widget: "datetime", time_format: false, date_format: "YYYY-MM-DD", format: "YYYY-MM-DD", required: false }
          - { label: "Projecte (opcional)", name: "projecte", widget: "string", required: false, hint: "Identificador curt del projecte, p. ex. 13-b." }
          - { label: "Estat", name: "estat", widget: "select", options: ["pendent", "en curs", "feta", "descartada"], default: "pendent" }
      - label: "Visibilitat"
        name: "visibilitat"
        widget: "select"
        options: ["interna", "publica"]
        default: "interna"
        hint: "Totes les actes viuen al repositori privat. «publica» només marca que es podria publicar més endavant."
      - { label: "Esborrany (camp antic)", name: "draft", widget: "hidden" }
      - { label: "Contingut", name: "body", widget: "markdown", required: false, hint: "El text llarg de l'acta. El que s'ha decidit de veritat va als camps de dalt." }

  - name: "concurs"
    label: "Documentació · Concurs Cordoncillo"
    label_singular: "Document del concurs"
    folder: "concurs"
    create: true
    fields:
      - { label: "Títol", name: "title", widget: "string" }
      - { label: "Tipus de document", name: "tipo", widget: "select", options: ["Bases del concurs", "Convocatòria", "Categories", "Grup de música", "Dates i calendari", "Altres"] }
      - { label: "Data", name: "date", widget: "datetime", required: false }
      - { label: "Esborrany (camp antic)", name: "draft", widget: "hidden" }
      - { label: "Contingut", name: "body", widget: "markdown" }
