<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>9 Barris Imatge · Gestor intern</title>
  <!-- Estils copiats de ../index.html (gestor principal). Si es canvien allà, cal copiar-los aquí. -->
  <style>
    :root {
      --cms-theme: rgb(29, 30, 32);
      --cms-primary: rgb(218, 218, 219);
      --cms-secondary: rgb(155, 156, 157);
      --cms-border: rgb(51, 51, 51);
      --cms-accent: #e03131;
      --cms-width: 1024px;
      --cms-gap: 20px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--cms-theme);
      color: var(--cms-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ---- Capçalera ---- */
    .cms-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      padding: 0.7rem max(1rem, calc((100vw - var(--cms-width)) / 2));
      background: #161618;
      border-bottom: 3px solid var(--cms-accent);
    }
    .cms-brand {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      text-decoration: none;
      color: var(--cms-primary);
    }
    .cms-brand img {
      height: 42px;
      width: auto;
      border-radius: 3px;
    }
    .cms-brand strong {
      font-size: 1.05rem;
      letter-spacing: 0.02em;
      line-height: 1.25;
    }
    .cms-brand strong small {
      display: block;
      color: var(--cms-secondary);
      font-weight: 500;
      font-size: 0.8rem;
    }
    .cms-nav {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }
    .cms-nav a {
      color: var(--cms-primary);
      text-decoration: none;
      font-size: 0.9rem;
      padding: 0.4rem 0.8rem;
      border-radius: 5px;
      border: 1px solid var(--cms-border);
      background: #202023;
    }
    .cms-nav a:hover,
    .cms-nav a:focus {
      border-color: var(--cms-accent);
      text-decoration: underline;
    }
    .cms-nav a.cms-nav--back {
      border-color: transparent;
      background: transparent;
    }
    .cms-rail {
      flex: 0 0 15rem;
      align-self: flex-start;
      position: sticky;
      top: 0;
      max-height: 100vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      padding: 1.2rem 0.8rem;
      background: #161618;
      border-right: 1px solid var(--cms-border);
    }
    .cms-rail-group {
      margin: 1.2rem 0 0.3rem;
      padding-left: 0.8rem;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--cms-secondary);
    }
    .cms-rail a,
    .cms-years > summary {
      display: block;
      color: var(--cms-primary);
      text-decoration: none;
      font-size: 0.9rem;
      padding: 0.45rem 0.8rem;
      border-radius: 5px;
    }
    .cms-rail a:hover,
    .cms-rail a:focus,
    .cms-years > summary:hover,
    .cms-years > summary:focus {
      background: #202023;
      text-decoration: underline;
    }
    .cms-years {
      position: relative;
    }
    .cms-years > summary {
      list-style: none;
      cursor: pointer;
      border: 1px solid var(--cms-border);
      background: #202023;
    }
    .cms-years > summary::-webkit-details-marker {
      display: none;
    }
    .cms-years > summary::after {
      content: " ▾";
      color: var(--cms-secondary);
    }
    .cms-years[open] > summary {
      border-color: var(--cms-accent);
    }
    .cms-years-menu {
      margin: 0.25rem 0 0.4rem;
      display: flex;
      flex-direction: column;
      max-height: 60vh;
      overflow-y: auto;
      border-left: 1px solid var(--cms-border);
      padding-left: 0.5rem;
    }
    .cms-years-menu a[aria-current="true"] {
      color: var(--cms-accent);
      font-weight: 700;
    }
    .cms-rail-note {
      margin: 1.2rem 0 0;
      padding: 0.6rem 0.8rem;
      border: 1px solid var(--cms-border);
      border-radius: 5px;
      font-size: 0.75rem;
      line-height: 1.4;
      color: var(--cms-secondary);
    }
    #nc-root .primary-sidebar {
      display: none !important;
    }
    #nc-root main {
      padding-left: 0;
    }
    @media (max-width: 900px) {
      #nc-root { min-height: 60vh; }
      .cms-app {
        flex-direction: column;
      }
      .cms-rail {
        flex: 0 0 auto;
        position: static;
        max-height: none;
        width: 100%;
        flex-direction: row;
        flex-wrap: wrap;
        gap: 0.35rem;
        border-right: 0;
        border-bottom: 1px solid var(--cms-border);
      }
      .cms-rail-group {
        width: 100%;
        margin: 0.6rem 0 0;
      }
      .cms-years-menu {
        max-height: 40vh;
      }
    }

    /* ---- Cos (aplicació Sveltia) ---- */
    .cms-app {
      flex: 1 1 auto;
      display: flex;
      min-height: 0;
    }

    /* ---- Contenidor de l'aplicació Sveltia ---- */
    #nc-root {
      flex: 1 1 auto;
      display: block;
      background: var(--cms-theme);
      min-height: 65vh;
      min-width: 0;
      padding-left: 0;
    }

  </style>
</head>
<body>

  <header class="cms-header">
    <a class="cms-brand" href="../../" title="Torna al web de 9 Barris Imatge">
      <img src="../../images/logo-header.jpg" alt="Logo de 9 Barris Imatge" width="42" height="66" />
      <strong>9 Barris Imatge<small>Gestor intern</small></strong>
    </a>
    <nav class="cms-nav" aria-label="Navegació del gestor">
      <a href="../">Gestor del web</a>
      <a class="cms-nav--back" href="../../">Torna al web</a>
    </nav>
  </header>

  <div class="cms-app">
    <aside class="cms-rail" aria-label="Seccions del gestor intern">
      <a href="#/collections/actes">Reunions (assamblees)</a>
      <a href="tasques.html">Tasques obertes</a>
      <a href="#/collections/concurs">Documentació · Concurs</a>
      <p class="cms-rail-note">Tot el que hi ha aquí viu al repositori privat 112books/9bi-intern i no es publica al web.</p>
    </aside>
    <!-- Sveltia monta tota la interfície dins d'aquest contenidor -->
    <div id="nc-root"></div>
  </div>

  <script>
    // Amaga la barra lateral nativa del Sveltia (mateix mètode que /admin/)
    const cmsRoot = document.getElementById("nc-root");
    function cmsHideNativeSidebar() {
      if (!cmsRoot) return;
      const sidebar = cmsRoot.querySelector(".primary-sidebar");
      if (!sidebar) return;
      let el = sidebar;
      while (el && el.id !== "page-container") {
        if (el.querySelector("main")) break;
        el.style.display = "none";
        el = el.parentElement;
      }
    }
    if (cmsRoot) {
      cmsHideNativeSidebar();
      new MutationObserver(cmsHideNativeSidebar).observe(cmsRoot, { childList: true, subtree: true });
    }
  </script>

  <!-- El mateix Sveltia autoallotjat del gestor principal; llegeix ./config.yml -->
  <script defer src="../sveltia-cms.js"></script>
</body>
</html>
