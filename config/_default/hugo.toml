# baseURL es defineix per entorn:
#   config/development/hugo.toml -> local (hugo server)
#   config/staging/hugo.toml     -> Codeberg Pages de desenvolupament
#   config/production/hugo.toml  -> domini definitiu (9barrisimatge.org)
title = "Col·lectiu fotogràfic 9 Barris Imatge"
theme = "PaperMod"
locale = "ca"
defaultContentLanguage = "ca"
timeZone = "Europe/Madrid"
enableRobotsTXT = true
enableEmoji = true

# Peu de pàgina: llicència Creative Commons.
# La primera línia (a la plantilla) enllaça a la pàgina FAQ, que és on hi ha
# la resposta «Puc fer servir les fotografies del web?» amb l'enllaç a CC.
# NOTA: confirma la varietat de llicència exacta (ara: CC BY-NC-SA 4.0).
copyright = 'Contingut sota llicència Creative Commons Reconeixement-NoComercial-CompartirIgual 4.0'

# Preservem les URL .html de Blogger (/2026/07/slug.html)
uglyURLs = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

[permalinks]
  posts = "/:year/:month/:slug"

[markup.goldmark.parser.attribute]
  block = true

[markup.goldmark.renderer]
  unsafe = true

# Taxonomies: tag → tags, categoria → categories
[taxonomies]
  tag = "tags"
  category = "categories"
  author = "author"

[pagination]
  # Portada: graella de 4 columnes x 2 files (8 articles per pàgina)
  pagerSize = 8

[params]
  # Tema per defecte: fosc (es pot canviar a clar amb el botó sol/lluna, Alt+T).
  defaultTheme = "dark"

  # Seccions principals: només els articles (posts) surten a la portada;
  # les guies i la documentació són internes (backend) i no hi apareixen.
  mainSections = ["posts"]

  description = "Des de 2002 documentant Nou Barris (Barcelona). Blog del col·lectiu fotogràfic 9 Barris Imatge."
  ShowPostAuthors = true
  ShowBreadCrumbs = false
  ShowReadingTime = false
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowWordCount = false
  comments = false

  # Logo del header (asset a assets/images/logo-header.jpg)
  [params.label]
    icon = "images/logo-header.jpg"
    iconHeight = 229

  [params.homeInfoParams]
    Title = "9 Barris Imatge"
    Content = "Documentant Nou Barris (Barcelona) des del 2002"

  [params.editPost]
    URL = ""
    Text = ""
    appendFilePath = false

