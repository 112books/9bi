# baseURL es defineix per entorn:
#   config/development/hugo.toml -> local (hugo server)
#   config/staging/hugo.toml     -> Codeberg Pages de desenvolupament
#   config/production/hugo.toml  -> domini definitiu (9barrisimatge.org)
title = "9 Barris Imatge"
theme = "PaperMod"
locale = "ca"
defaultContentLanguage = "ca"
timeZone = "Europe/Madrid"
enableRobotsTXT = true
enableEmoji = true

# Peu de pàgina: llicència Creative Commons (amb enllaç al web en català).
# NOTA: confirma la varietat de llicència exacta (ara: CC BY-NC-SA 4.0).
copyright = 'Contingut sota llicència <a rel="license" href="https://creativecommons.org/licenses/by-nc-sa/4.0/deed.ca">Creative Commons Reconeixement-NoComercial-CompartirIgual 4.0</a>'

# Preservem les URL .html de Blogger (/2026/07/slug.html)
uglyURLs = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

[permalinks]
  posts = "/:year/:month/:slug"

[markup.goldmark.parser.attribute]
  block = true

[markup.goldmark.renderer]
  unsafe = true

# Taxonomies: tag → tags, categoria → categories
[taxonomies]
  tag = "tags"
  category = "categories"

[pagination]
  # Portada: graella de 4 columnes x 2 files (8 articles per pàgina)
  pagerSize = 8

[params]
  # Seccions principals: només els articles (posts) surten a la portada;
  # les guies i la documentació són internes (backend) i no hi apareixen.
  mainSections = ["posts"]

  description = "Des de 2002 documentant Nou Barris. Blog de l'Associació fotogràfica 9 Barris Imatge de Barcelona."
  ShowPostAuthors = true
  ShowBreadCrumbs = false
  ShowReadingTime = false
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowWordCount = false
  comments = false

  # Logo del header (asset a assets/images/logo-header.jpg)
  [params.label]
    icon = "images/logo-header.jpg"
    iconHeight = 36

  [params.homeInfoParams]
    Title = "9 Barris Imatge"
    Content = "Des de 2002 documentant Nou Barris - Barcelona"

  [params.editPost]
    URL = ""
    Text = ""
    appendFilePath = false

