app_name = Votación
page_title = Voto del público
vote_header = Vota tu obra preferida
vote_intro = Escribe el número de la fotografía que más te guste y envía tu voto.
vote_note_mbl = Esta votación solo se puede hacer desde un teléfono o una tableta. Si no tienes, pide a un amigo que te preste la suya.
vote_conditions = <h2>Cómo funciona el voto</h2><ul><li>Vota desde la exposición: tienes que estar a menos de 500 m del Casal de Barri de Prosperitat.</li><li>Solo se puede votar desde un teléfono o una tableta.</li><li>Un voto por obra y dispositivo. Una vez enviado no se puede cambiar.</li></ul>
select_prompt = Número de la obra
btn_vote = Enviar voto
msg_vote_ok = Voto registrado. ¡Gracias por participar!
msg_vote_repeat = Ya has votado esta obra desde este dispositivo.
msg_edition_closed = La votación está cerrada.
msg_edition_inactive = La votación no está activa en este momento.
msg_token_invalid = Enlace no válido.
msg_no_works = Aún no hay obras publicadas para la votación.
msg_invalid_obra = Ese número de obra no existe.
msg_rate_limited = Demasiadas peticiones. Espera un momento e inténtalo de nuevo.
admin_visits_title = Visitas vía QR
admin_visits_total = Visitas
admin_visits_uniq = Dispositivos únicos
admin_visits_day = Día
admin_visits_count = Visitas
geo_requesting = Verificando tu ubicación…
geo_error_no_pos = No se ha podido confirmar la ubicación. El voto podrá enviarse igualmente.
geo_error_hard = Para poder votar tienes que estar a menos de 500 m del Casal de Barri de Prosperitat. Si estás cerca, comprueba que el navegador te deje usar la ubicación (permisos del sitio) y que la localización del teléfono esté activada; después vuelve a cargar la página y vota.
lang_code = es
vote_hint_num = El número de cada fotografía es el que tiene al lado, en la exposición.
geo_msg_denied = Has bloqueado la ubicación para este sitio. Para permitirla, abre los permisos del navegador (icono del candado o de la información en la barra de direcciones), elige «Ubicación» y permítela. Después vuelve a cargar la página.
geo_msg_unavailable = No se ha podido leer la ubicación. Activa la localización del teléfono e inténtalo de nuevo.
geo_msg_timeout = Ha tardado demasiado en obtener la ubicación. Inténtalo de nuevo.
geo_msg_insecure = Esta página se tiene que abrir con conexión segura (https) para poder votar. Vuelve a cargarla; si no, ábrela directamente en https://vots-cordoncillo.linuxbcn.com/v/cordoncillo-2026
geo_btn = Activar la ubicación
msg_vote_repeat_wait = Ya has votado esta obra desde este dispositivo. Para las pruebas se puede volver a votar daqui a %d minutos.
vote_privacy_note = Los votos son anónimos: no se pide el nombre ni el correo electrónico y no se guardan las coordenadas. Solo se registra un código aleatorio del dispositivo y si la ubicación estaba dentro del radio. Más información en la protección de datos del colectivo.
