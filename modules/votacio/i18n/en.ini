app_name = Voting
page_title = Public vote
vote_header = Vote for your favourite work
vote_intro = Write the number of the photograph you like most and send your vote.
vote_note_mbl = This vote can only be cast from a phone or tablet. If you do not have one, ask a friend to lend you theirs.
vote_conditions = <h2>How the vote works</h2><ul><li>Vote from the exhibition: you must be within 500 m of the Casal de Barri de Prosperitat.</li><li>Votes can only be cast from a phone or tablet.</li><li>One vote per work and device. Once sent it cannot be changed.</li></ul>
select_prompt = Work number
btn_vote = Send vote
msg_vote_ok = Vote recorded. Thanks for taking part!
msg_vote_repeat = You have already voted for this work from this device.
msg_edition_closed = The vote is closed.
msg_edition_inactive = The vote is not active right now.
msg_token_invalid = Invalid link.
msg_no_works = There are no works published to vote for yet.
msg_invalid_obra = That work number does not exist.
msg_rate_limited = Too many requests. Wait a moment and try again.
admin_visits_title = Visits via QR
admin_visits_total = Visits
admin_visits_uniq = Unique devices
admin_visits_day = Day
admin_visits_count = Visits
geo_requesting = Checking your location…
geo_error_no_pos = Could not confirm your location. The vote can still be sent.
geo_error_hard = To vote you must be within 500 m of the Casal de Barri de Prosperitat. If you are nearby, check that the browser allows using your location (site permissions) and that location is turned on on your phone; then reload the page and vote.
lang_code = en
vote_hint_num = The number of each photo is the one shown next to it, at the exhibition.
geo_msg_denied = You have blocked the location for this site. To allow it, open the browser permissions (padlock or info icon in the address bar), choose «Location» and allow it. Then reload the page.
geo_msg_unavailable = Your location could not be read. Turn on location on your phone and try again.
geo_msg_timeout = It took too long to get your location. Please try again.
geo_msg_insecure = This page must be opened over a secure connection (https) in order to vote. Reload it; if it does not change, open https://vots-cordoncillo.linuxbcn.com/v/cordoncillo-2026 directly
geo_btn = Turn on location
msg_vote_repeat_wait = You have already voted for this work from this device. For testing purposes you can vote again in %d minutes.
vote_privacy_note = Votes are anonymous: no name or email is requested and coordinates are not stored. Only a random device code and whether the location was within the radius are recorded. More information in the collective's data protection policy.
