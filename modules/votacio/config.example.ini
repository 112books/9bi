# votacio — config d'exemple
# Copia-ho a config.ini i omple els valors reals.
# Els secrets es poden sobreescriure amb variables d'entorn:
#   VOTACIO_SECRET, VOTACIO_ADMIN, VOTACIO_CONFIG

[general]
app_name = Votacio
default_lang = ca
# ssl = true per defecte al codi (cookie Secure); posa 0 només per provar en HTTP pla
ssl = true
cookie_name = vid
# Peticions per minut i per IP (anti-spam)
rate_limit = 40
# Secret per signar testimonis de vot (HMAC). Envent de producció:
secret = CANVIA-ME
admin_secret = CANVIA-ME-ADMIN

[db]
# Ruta al fitxer SQLite (pot ser relativa a MODULE_DIR)
path = data.db

[edicio]
nom = 36è Concurs Cordoncillo — vot del públic
# Finestra de votació (hora local del servidor, Europe/Madrid)
data_inici = 2026-12-01T00:00:00
data_fi = 2026-12-15T23:59:59
# Token secret que apareix a la URL del QR (genera'l aleatori, p. ex. secrets.token_urlsafe(12))
secret_token = CANVIA-ME-TOKEN
# mode_geo: off | soft | hard (vegeu README)
#   hard: es bloqueja el vot fora del radi (recomanat per evitar enviar l'enllaç a amics)
mode_geo = hard
# Centre del radi i radi en metres. IMPORTANT: coordones verificades, no inventades.
# 2026-09-26: Casal de Barri de Prosperitat, Plaça d'Àngel Pestanya (08016 Barcelona)
# = 41.441623 / 2.179794, confirmat amb Nominatim, Photon i geocodi invers
lat = 41.441623
lon = 2.179794
radi = 500
# collect_data: none | contact (none per defecte; contact requereix consentiment exprés RGPD)
collect_data = none
# Entrades via QR: registra cada visita a /v/<token> per veure-les a /admin/visites (sempre actiu)
# Bloc de condicions al formulari (1 = mostrar; 0 = amagar). Útil per a altres entitats/Taro.
mostrar_condicions = 0
# Límit de vots per obra i dispositiu:
#   1 (per defecte) = un sol vot per obra i dispositiu per tota l'edició
#   0 = sense límit (mode obert de proves: es pot tornar a votar la mateixa obra)
vot_limit = 1
# re-vot per proves: minutes fins a poder tornar a votar la mateixa obra des del
# mateix dispositiu (la votació anterior se substitueix). 0 = un sol vot per tota
# l'edició, que és el valor per a l'exposició. Mentre hi hagi proves, 10.
revote_minutes = 0
# activa = 1 | 0 (si 0, la URL del QR torna "edició no activa")
activa = 1

[obres]
# Una línia per obra: clau = numero|titol|autor|categoria (titol/autor/categoria opcionals)
# 1 = Retrat de barri||A
# 2 = ||B