# votació — config d'exemple
# Copia-ho a config.ini i omple els valors reals. config.ini NO va a git.
# Els secrets es poden sobreescriure amb variables d'entorn:
#   VOTACIO_SECRET, VOTACIO_ADMIN, VOTACIO_CONFIG
#
# Genera els secrets amb:  python3 -c "import secrets; print(secrets.token_urlsafe(32))"

[general]
# Qui és l'entitat que vota. Es veu a la capçalera del formulari.
entitat = Nom de l'entitat
# Text petit sota el nom (per exemple el nom del concurs o de l'exposició).
subtitol =
# Adreces del peu de pàgina. Deixa-les buides si no les vols: sense URL no
# es fa cap enllaç. Sense «privacitat» la votació de geolocalització no té
# on explicar què es recull, aix que posa-la.
url_home =
url_edicio =
url_privacitat =
# Text del títol de l'aplicació i idioma per defecte (ca | es | en)
app_name = Votació
default_lang = ca
# ssl = true per defecte al codi (cookie Secure); posa 0 només per provar en HTTP pla
ssl = true
cookie_name = vid
# Peticions per minut i per IP (anti-spam)
rate_limit = 40
# Secret per signar testimonis de vot (HMAC). En producció, genera'l.
secret = CANVIA-ME
admin_secret = CANVIA-ME-ADMIN

[db]
# Ruta al fitxer SQLite (pot ser relativa a la carpeta del mòdul)
path = data.db

[edicio]
# Nom de l'edició de votació (queda guardat a la base de dades)
nom = Nom de l'edició
# Finestra de votació (hora local del servidor, Europe/Madrid)
data_inici = 2026-01-01T00:00:00
data_fi = 2026-01-31T23:59:59
# Token secret que apareix a la URL del QR
# (genera'l aleatori: python3 -c "import secrets; print(secrets.token_urlsafe(12))")
secret_token = CANVIA-ME-TOKEN
# mode_geo: off | soft | hard (vegeu README)
#   off:  no es mira on és ningú
#   soft: es registra si era dins o fora del radi, però el vot s'accepta igual
#   hard: es rebutja (403) el vot lluny del punt de votació
mode_geo = hard
# Centre del radi i radi en metres. IMPORTANT: coordones verificades, no
# inventades; posa les del lloc on es fa la votació. Comprova-les amb un
# servei de geocodificació (Nominatim, Photon) o amb el geocodificador invers.
lat = 41.000000
lon = 2.000000
radi = 500
# Nom del lloc on es fa la votació; surt als textos que expliquen les condicions
lloc_votacio =
# collect_data: none | contact
#   none    = no es demana cap dada personal
#   contact = es pot demanar contacte (requereix consentiment exprés i avís RGPD)
collect_data = none
# Bloc de condicions al formulari (1 = mostrar; 0 = amagar)
mostrar_condicions = 1
# Límit de vots per obra i dispositiu:
#   1 (per defecte) = un sol vot per obra i dispositiu per tota l'edició
#   0 = sense límit (mode obert de proves: es pot tornar a votar la mateixa obra)
vot_limit = 1
# Re-vot per proves: minuts fins a poder tornar a votar la mateixa obra des del
# mateix dispositiu (la votació anterior se substitueix). 0 = un sol vot per
# tota l'edició, que és el valor per a l'exposició.
revote_minutes = 0
# activa = 1 | 0 (si 0, la URL del QR torna "edició no activa")
activa = 1

[obres]
# Una línia per obra: clau = numero|titol|autor|categoria
# (titol, autor i categoria són opcionals; el número és el que es presenta)
# 1 = Retrat de barri||A
# 2 = ||B
