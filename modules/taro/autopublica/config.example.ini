; config.example.ini per a autopublica (bundle taro)
; =================================================
; Aquest fitxer documenta el LAYOUT. Per funcionar, copieu-lo a «config.ini»
; (a la mateixa carpeta) i poseu els valors reals. «config.ini» NO va a git
; (vegeu modules/taro/.gitignore).
;
[general]
; secret_token = ...   ; token real del secret d'autopublica
; destaca_ratio_autors = ...   ; (claus llegides pel codi — vegeu els comentaris del propi app.py)

[smtp]
; host = ...
; port = ...
; ssl = true
; user = ...
; password = ...
; from = ...
; from_name = ...

[publish]
; interval_min = ...
; max_per_dia = ...
; destaca_ratio_autors = ...

[admin]
; usuari = admin
; contrasenya = ...

[log]
; level = INFO
