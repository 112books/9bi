; config.example.ini per al ROUTER del bundle taro
; =================================================
; El router (modules/taro/app.py) NO llegeix cap config: simplement
; encamina per prefix. Aquest fitxer és un OBERT de contacte/documentació.
;
; Layout de muntatge (Passenger):
;   /taro/health               → propi del router
;   /taro/autopublica/…        → modules/taro/autopublica/app.py  (app_name=autopublica)
;   /taro/votacio/…            → modules/taro/votacio/app.py  (app_name=votacio)
;   /taro/formularis/…         → modules/taro/formularis/app.py (app_name=formularis)
;
; Cada submòdul llegeix el SEU config.ini de la SEVA carpeta.
