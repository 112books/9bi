# formularis — config d'exemple
# Copia-ho a config.ini AL SERVIDOR i omple els valors reals.
# config.ini NO s'ha de pujar mai al repositori (vegeu .gitignore).
# La contrasenya també es pot deixar fora del fitxer amb la variable
# d'entorn FORMULARIS_SMTP_PASSWORD (té prioritat sobre [smtp] password).

[general]
app_name = Formularis
default_lang = ca
# Peticions per minut i per IP (anti-spam)
rate_limit = 20
# Orígens autoritzats a fer POST, separats per comes. Ha de ser el domini
# del web (si el formulari és estàtic, a GitHub Pages o similar). Sense
# aquesta llista l'aplicació rebutja tots els enviaments amb 403.
allowed_origins = https://exemple.org,https://www.exemple.org
# Adreça de retorn dels correus, si el formulari no té secció pròpia
destinatari = contacte@exemple.org
# Adreça del web (es fica al peu del correu per transparència)
site_url = https://exemple.org/
# Pàgina amb la política de privacitat. Si la deixes buida, es fa servir
# site_url + "/privacitat/". Amb la votació per geolocalització, posa-la:
# sense URL no hi ha on explicar què es recull.
url_privacitat = https://exemple.org/privacitat/

[legal]
# ⚠ Dades del responsable del tractament. S'envien dins de cada correu,
#   aix que han de ser les teves, no les del mòdul. Si falten, el servei
#   es nega a enviar res enlloc d'enviar un correu que ho digui malament.
entitat = Nom de l'entitat
adreca = Adreça fiscal de l'entitat
correu = contacte@exemple.org
# Qui hi ha darrere del correu: el teu hosting i el proveïdor de correu.
corresponsalia = el servei de formularis d'aquest web i el proveïdor de correu del hosting
# Organisme de reclamació, si no és l'AEPD
aepd = Agència Espanyola de Protecció de Dades (aepd.es)

[smtp]
# Servidor de correu del hosting: SMTPS implícit (ssl = true, port 465) o
# STARTTLS (ssl = false, port 587). Els dos ports ofereixen AUTH LOGIN.
host = correu.exemple.org
port = 465
ssl = true
# Usuari complet (amb @domini) i contrasenya del compte de correu
user = contacte@exemple.org
password =
# Remitent visible del correu
from = contacte@exemple.org
from_name = Formulari del web

[destinataris]
# A qui arriba cada formulari
contacte = contacte@exemple.org
incorpora-te = contacte@exemple.org

# ── Els formularis i els camps que s'accepten ───────────────────────────
# Per tenir-ne de nous, afegeix una secció per formulari. Tot el que no
# sigui a la llista de «camps» es descarta, encara que el navegador l'enviï.
#
#   camps           camps acceptats, separats per comes
#   assumpte        text fix de l'assumpte del correu
#   prefix_assumpte si | no  — si és «si», hi posa davant el que hagi
#                   escrit la persona en el camp «assumpte»
#   finalitat       per què es tracten les dades (obligatori per RGPD)

[formularis.contacte]
camps = nom,email,assumpte,entitat,missatge,consentiment
assumpte = Missatge des del web
prefix_assumpte = si
finalitat = atendre i respondre la teva consulta, i les gestions internes que se'n derivin.

[formularis.incorpora-te]
camps = nom_complet,nom_artistic,usuari_github,email,web,instagram,galeries,consentiment
assumpte = Alta de membre
finalitat = gestionar el teu perfil de membre i l'accés al gestor de continguts del web.
