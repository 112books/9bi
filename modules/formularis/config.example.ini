# formularis — config d'exemple
# Copia-ho a config.ini AL SERVIDOR i omple els valors reals.
# config.ini NO s'ha de pujar mai al repositori (vegeu .gitignore).
# La contrasenya també es pot deixar fora del fitxer amb la variable
# d'entorn FORMULARIS_SMTP_PASSWORD (té prioritat sobre [smtp] password).

[general]
app_name = Formularis 9 Barris Imatge
default_lang = ca
# Peticions per minut i per IP (anti-spam)
rate_limit = 20
# Orígens autoritzats a fer POST, separats per comes. Ha de ser el domini
# del web (el formulari és estàtic, a GitHub Pages). Sense aquesta llista
# l'aplicació rebutja tots els enviaments amb 403.
allowed_origins = https://9barrisimatge.org,https://www.9barrisimatge.org
# Adreça de retorn dels correus, si el formulari no té secció pròpia
destinatari = info@9barrisimatge.org
# Adreça del web (es fica al peu del correu per transparència)
site_url = https://9barrisimatge.org/

[smtp]
# Servidor de correu del hosting: SMTPS implícit (ssl = true, port 465) o
# STARTTLS (ssl = false, port 587). Els dos ports ofereixen AUTH LOGIN.
host = 9barrisimatge-org.correoseguro.dinaserver.com
port = 465
ssl = true
# Usuari complet (amb @domini) i contrasenya del compte de correu
user = info@9barrisimatge.org
password =
# Remitent visible del correu
from = info@9barrisimatge.org
from_name = Formulari del web 9 Barris Imatge

[destinataris]
# A qui arriba cada formulari
contacte = info@9barrisimatge.org
incorpora-te = info@9barrisimatge.org

[comentaris]
# Comentaris de les entrades amb moderació prèvia (comentaris.py)
# A qui arriba l'avís de cada comentari nou
moderador = info@9barrisimatge.org
# Adreça pública d'aquest servei (per a l'enllaç de revisió del correu)
base_url = https://formularis.linuxbcn.com
# Clau per signar els enllaços de revisió: 64 caràcters aleatoris.
# Genera-la al servidor: python3 -c "import secrets; print(secrets.token_hex(32))"
secret = CANVIA-ME
# Token de GitHub per publicar els comentaris aprovats. Fine-grained,
# NOMÉS al repositori 112books/9bi i NOMÉS el permís «Contents: Read and write».
github_token =
github_repo = 112books/9bi
github_branch = main
# Carpeta dels comentaris pendents (per defecte, ./comentaris/pendents)
# dir =
