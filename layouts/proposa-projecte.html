{{- define "main" }}
{{- /* /projectes/proposa/: formulari per proposar projectes (envia al servei de contacte) */ -}}
<article class="post-single projecte">
  <header class="post-header projecte-hero">
    {{- partial "projectes-fil.html" . }}
    <h1 class="post-title">{{ .Title }}</h1>
    {{- with .Description }}<div class="post-description">{{ . }}</div>{{ end }}
  </header>
  <div class="post-content md-content">
    {{- .Content }}
  </div>
</article>
{{- end }}
