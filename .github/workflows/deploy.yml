name: Build i deploy a GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    # Cada 6 hores (cron en UTC: 00:00, 06:00, 12:00, 18:00 → 02:00, 08:00,
    # 14:00 i 20:00 a Barcelona) per refrescar /stats/ i /mes-visitats/ amb
    # GoatCounter sense cap push. Si un dia no hi ha activitat al repositori
    # durant 60 dies, GitHub desactiva els workflow programats.
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Instal·la Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78
        with:
          hugo-version: "0.164.0"
          extended: true

      - name: Refresca les estadístiques del web (si hi ha API key)
        run: |
          if [ -n "$GOATCOUNTER_API_KEY" ]; then
            python3 scripts/fetch_9bi_analytics.py
          else
            echo "GOATCOUNTER_API_KEY no definida; no es refresca /stats/"
          fi
        env:
          GOATCOUNTER_API_KEY: ${{ secrets.GOATCOUNTER_API_KEY }}

      - name: Refresca els articles més visitats (si hi ha API key)
        run: |
          if [ -n "$GOATCOUNTER_API_KEY" ]; then
            python3 scripts/goatcounter_popular.py --days 30 || \
              echo "AVÍS: no s'ha pogut refrescar /mes-visitats/; es publica amb les dades del repositori"
          else
            echo "GOATCOUNTER_API_KEY no definida; /mes-visitats/ es queda amb les dades del repositori"
          fi
        env:
          GOATCOUNTER_API_KEY: ${{ secrets.GOATCOUNTER_API_KEY }}

      - name: Build amb Hugo (producció)
        run: hugo --minify --environment production

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: public/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e